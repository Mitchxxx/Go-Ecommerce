events {}
http {
  include /etc/nginx/mime.types;
  default_type  application/octet-stream;

  resolver 127.0.0.11 valid=30s;

  # map must be here (http context), not in server/location
  map $uri $image_ct {
      default        "";
      ~*\.jpe?g$     "image/jpeg";
      ~*\.png$       "image/png";
      ~*\.gif$       "image/gif";
      ~*\.webp$      "image/webp";
      ~*\.svg$       "image/svg+xml";
  }

  server {
    listen 80;

    location /uploads/ {
      # First try local files, then fallback to S3
      try_files $uri @s3;
      root /var/www;
    }

    location @s3 {
      # Extract the path after /uploads/ and reconstruct the full S3 URL
      set $s3_bucket "ecommerce-uploads";
      set $s3_key $uri;

      # Remove /uploads/ prefix from the URI
      if ($s3_key ~ ^/uploads/(.*)$) {
          set $s3_path $1;
      }

      # Build complete S3 URL with bucket
      set $s3_url "http://localstack:4566/${s3_bucket}/${s3_path}";

      proxy_pass $s3_url;
      proxy_set_header Host localhost:4566;

      # Remove download headers
      proxy_hide_header Content-Disposition;
      add_header Content-Disposition "inline" always;

      # Set correct Content-Type based on file extension
      proxy_hide_header Content-Type;
      if ($image_ct != "") {
          add_header Content-Type $image_ct always;
      }

      # Important: Disable buffering and handle redirects
      proxy_buffering off;
      proxy_redirect off;

      # Pass through other S3 headers
      proxy_pass_header ETag;
      proxy_pass_header Last-Modified;

      # Handle CORS if needed
      add_header Access-Control-Allow-Origin "*" always;
    }
  }
}